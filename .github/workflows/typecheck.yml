name: CI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-only placeholders: no production credentials or database writes.
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-build-only-not-a-production-secret
      NEXT_PUBLIC_SITE_URL: https://amxinz.com
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: amxinz_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          try {
            const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const summary = audit.metadata?.vulnerabilities ?? {};
            console.log("Dependency audit summary:", JSON.stringify(summary));
            for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
              const titles = (item.via ?? []).map((entry) => typeof entry === "string" ? entry : entry.title).filter(Boolean).join("; ");
              console.log(`[${String(item.severity).toUpperCase()}] ${name} ${item.range}; direct=${item.isDirect}; fixAvailable=${JSON.stringify(item.fixAvailable)}; ${titles}`);
            }
          } catch (error) {
            console.log("npm audit report could not be parsed:", String(error));
          }
          NODE
      - name: Build production application
        run: npm run build
